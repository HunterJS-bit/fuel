services:
  postgres:
    image: postgres:16-alpine
    container_name: fuelcalc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuelcalc
      POSTGRES_PASSWORD: fuelcalc
      POSTGRES_DB: fuelcalc
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/stations_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./scripts/seed-prices.sql:/docker-entrypoint-initdb.d/03_prices.sql:ro
    networks:
      - postgres-network

  api:
    build: ./api-server
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://fuelcalc:fuelcalc@postgres:5432/fuelcalc
      - PORT=4000
    command: npm run start
    depends_on:
      postgres:
        condition: service_started
    networks:
      - postgres-network
    restart: unless-stopped
  # frontend:
  #   build: ./frontend-server
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     - API_BASE_URL=http://api:4000
  #   depends_on:
  #     - api
  #   restart: unless-stopped

  adminer:
    image: adminer:5.2.1
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - postgres-network

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres_data:
